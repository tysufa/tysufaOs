[include]
files = [

]

[bar]
order = [ "default" ]

    [bar.default]
    enabled = true

[dock]
enabled = true
pinned = [ "zen" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 818.0
    output = "eDP-1"
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_day = 6800
temperature_night = 5000

[shell]
password_style = "random"
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = true
    privilege_command = "kitty -e sudo pkexec"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "zen-browser", "discord", "neovim", "vicinae", "zellij", "bat" ]

[wallpaper]
directory = "/home/tysufa/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/tysufa/Pictures/Wallpapers/wallhaven-gwm2z3.jpg"

    [wallpaper.last]
    path = "/home/tysufa/Pictures/Wallpapers/wallhaven-gwm2z3.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/tysufa/Pictures/Wallpapers/wallhaven-gwm2z3.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/tysufa/Pictures/Wallpapers/wallhaven-gwm2z3.jpg"

